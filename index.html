<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>陈辉阳 | AI产品经理作品集</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="2026届软件工程应届毕业生 | AI产品经理作品集">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    .app-name a { font-weight: 700; }
    .cover-main h1 { font-size: 2.8rem; margin-bottom: 1rem; }
    .cover-main blockquote { margin: 1.5rem 0; }
    .cover-main .buttons a { margin: 0 .5rem; }
    @media (max-width: 768px) {
      .cover-main h1 { font-size: 2rem; }
      .cover-main p { font-size: 1rem; }
      .cover-main .buttons { display: flex; flex-direction: column; gap: .5rem; }
      .cover-main .buttons a { margin: 0; }
    }
    .github-corner svg { z-index: 9999; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      routerMode: 'hash',
      name: '陈辉阳 · AI产品经理作品集',
      repo: 'https://github.com/',
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 搜索内容（项目/简历/知识点）',
        noData: '😵 没找到相关内容',
        depth: 4,
        hideOtherSidebarContent: false
      },
      pagination: {
        previousText: '‹ 上一页',
        nextText: '下一页 ›',
        crossChapter: true,
        crossChapterText: true
      },
      footer: {
        copy: '<span style="color: #999;">© 2026 陈辉阳 · AI产品经理 | 用 Docsify + Vercel 搭建</span>',
        auth: false,
        pre: '<hr/>',
        style: 'text-align: center; color: #ccc;'
      },
      plugins: [
        function(hook) {
          var footer = [
            '<hr/>',
            '<footer style="text-align: center; color: #999; padding: 1rem 0;">',
            '<a href="https://beian.miit.gov.cn/" target="_blank">粤ICP备XXXXXXXX号</a>（没有就删掉这一行）',
            '</footer>'
          ].join('');
          hook.afterEach(function(html) {
            return html + footer;
          });
        }
      ]
    }
    
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/typed.js@2/lib/typed.min.js"></script>
<style>
  #tsparticles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  section.cover { position: relative; z-index: 10; }
  section.cover .cover-main { position: relative; z-index: 11; }
  .float-tag { display: inline-block; padding: 8px 20px; margin: 8px; border-radius: 12px;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.3); color: #fff; font-weight: 500;
    animation: float 6s ease-in-out infinite; }
  .float-tag:nth-child(2) { animation-delay: 0.5s; }
  .float-tag:nth-child(3) { animation-delay: 1s; }
  .float-tag:nth-child(4) { animation-delay: 1.5s; }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
</style>
<script>
  // 粒子背景初始化
  window.addEventListener('DOMContentLoaded', () => {
    if (typeof tsParticles !== 'undefined') {
      tsParticles.load("tsparticles", {
        particles: {
          number: { value: 60, density: { enable: true, area: 800 } },
          color: { value: ["#ffffff", "#b8c1ff", "#ffc2e5"] },
          shape: { type: "circle" },
          opacity: { value: 0.5, random: true },
          size: { value: 3, random: true },
          line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.25, width: 1 },
          move: { enable: true, speed: 1.2, direction: "none", random: true, out_mode: "out" }
        },
        interactivity: {
          events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" } },
          modes: { grab: { distance: 200, line_linked: { opacity: 0.6 } }, push: { particles_nb: 3 } }
        },
        retina_detect: true
      });
    }
    // 打字机轮播 4 句 slogan
    if (typeof Typed !== 'undefined' && document.getElementById('typed-strings')) {
      new Typed("#typed-strings", {
        strings: [
          "🔥 寻找 AI 产品经理岗位 · 可立即到岗",
          "🎯 踩过 Vibe Coding 的坑 · 懂模型边界不瞎吹 AI",
          "🛠 3 个真实可运行 AI 项目 · 点击 Demo 现场可演示",
          "🛒 家庭电商背景 · 懂真实中小商家痛点"
        ],
        typeSpeed: 60, backSpeed: 30, loop: true, showCursor: true, cursorChar: "|",
        smartBackspace: true, backDelay: 2500
      });
    }
  });
</script>
</body>
</html>
